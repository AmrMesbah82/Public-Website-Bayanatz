<head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BUG-254: description + share previews (Open Graph / Twitter). -->
    <meta name="description" content="Bayanatz — MENA's digital transformation pioneers. Services, insights and careers.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://web-app-admin-33b9a.web.app/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bayanatz">
    <meta property="og:title" content="Bayanatz — MENA's Digital Transformation Pioneers">
    <meta property="og:description" content="Services, insights and careers at Bayanatz.">
    <meta property="og:url" content="https://web-app-admin-33b9a.web.app/">
    <meta property="og:image" content="https://web-app-admin-33b9a.web.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bayanatz — MENA's Digital Transformation Pioneers">
    <meta name="twitter:description" content="Services, insights and careers at Bayanatz.">
    <meta name="twitter:image" content="https://web-app-admin-33b9a.web.app/og-image.png">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Bayanatz">
    <!-- BUG-256: small icons (the 2000 px / 104 KB logo.png was the favicon). -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>

    <title>Bayanatz</title>
    <link rel="manifest" href="manifest.json">

    <!-- BUG-256: warm up the connections the app needs right away. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>

    <style>
      /* BUG-256: a brand loading screen is painted by the browser
         immediately, instead of a blank page until the app has started. */
      html, body { margin: 0; height: 100%; background: #F1F2ED; }
      #app-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: #F1F2ED; z-index: 9999;
        font-family: Cairo, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .3s ease;
      }
      #app-loading img { width: 88px; height: 88px; }
      #app-loading .bar {
        width: 140px; height: 4px; border-radius: 2px; overflow: hidden;
        background: #dfe3d8;
      }
      #app-loading .bar::after {
        content: ""; display: block; width: 40%; height: 100%;
        background: #008037; border-radius: 2px;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% { transform: translateX(-100%); } 100% { transform: translateX(250%); }
      }
      #app-loading.done { opacity: 0; pointer-events: none; }

      /* BUG-263: the page is drawn on a canvas, so the browser's print only
         captures one screen. Point people to the real PDF instead. */
      #print-note { display: none; }
      @media print {
        #print-note {
          display: block; font: 16px/1.5 system-ui, sans-serif; padding: 24px;
        }
      }
    </style>

    <!-- SPA redirect fix: handles direct URL access & page refresh -->
    <script>
        (function(l) {
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }(window.location));
    </script>
</head>
<body>
<div id="app-loading" role="progressbar" aria-label="Loading Bayanatz">
    <img src="apple-touch-icon.png" alt="Bayanatz">
    <div class="bar"></div>
</div>
<div id="print-note">
    To print a job post with all its text, open the job and use
    “Download PDF”. · لطباعة الوظيفة بكامل نصها افتح الوظيفة واستخدم «تنزيل PDF».
</div>
<script>
  // Remove the loading screen as soon as Flutter has painted its first frame.
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('app-loading');
    if (!el) return;
    el.classList.add('done');
    setTimeout(function () { el.remove(); }, 400);
  });
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
